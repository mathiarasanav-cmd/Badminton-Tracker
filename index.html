<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16307a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Badminton">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Badminton Court</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f4f8; --card: #ffffff; --card2: #eef1f7; --line: #e2e6ee; --text: #121826; --text2: #4a5263; --muted: #7d8595;
  --pri: #2f5bd8; --pri-soft: #e5ecfd; --on-pri: #fff; --hdr1: #13286b; --hdr2: #2a4fc4; --lime: #b8e62e;
  --bar: #2a78d6; --bar2: #1baf7a; --good: #0b8f3a; --good-bg: #e3f6ea; --warn: #a86f00; --warn-bg: #fff3d6; --crit: #d03b3b; --crit-bg: #fde9e9;
  --grid: #e6e9f0; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 3px 10px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0c0f16; --card: #171b25; --card2: #212634; --line: #2a3040; --text: #eef1f7; --text2: #b7bfcf; --muted: #8790a2;
    --pri: #6b8cff; --pri-soft: #1d2748; --on-pri: #0a1333; --hdr1: #0c1a46; --hdr2: #1b3486;
    --bar: #3987e5; --bar2: #199e70; --good: #4fd17d; --good-bg: #13301f; --warn: #f1b93b; --warn-bg: #362a0e; --crit: #ff8a8a; --crit-bg: #3a1717;
    --grid: #262c3a; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

header { position: sticky; top: 0; z-index: 20; color: #fff; background: linear-gradient(120deg, var(--hdr1), var(--hdr2)); padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 10px; }
header .logo { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 19px; }
header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header h1 small { display: block; font-size: 11px; font-weight: 500; opacity: .75; }
header .ib { background: rgba(255,255,255,.14); border: 0; color: inherit; height: 34px; min-width: 34px; border-radius: 17px; padding: 0 10px; font-size: 14px; }
#adm { display: none; background: var(--lime); color: #1c2a00; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 9px; }
body.admin #adm { display: inline-block; }
#sync { display: none; font-size: 11px; background: rgba(0,0,0,.25); padding: 3px 8px; border-radius: 9px; }
#sync.on { display: inline-block; }

main { padding: 12px 12px 24px; max-width: 720px; margin: 0 auto; }
.lt { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin: 6px 4px 10px; display: flex; align-items: baseline; gap: 8px; }
.lt small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.card h2 .r { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--pri); background: none; border: 0; padding: 2px; }
.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 18px 6px 8px; font-weight: 600; display: flex; }
.sec .r { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--pri); background: none; border: 0; font-size: 13px; font-weight: 600; }
.note { color: var(--muted); font-size: 12.5px; }
.hero { color: #fff; background: radial-gradient(120% 140% at 100% 0%, #4c74ff 0%, #2442b8 45%, #152a78 100%); position: relative; overflow: hidden; }
.hero::after { content: "🏸"; position: absolute; right: -8px; top: -14px; font-size: 110px; opacity: .12; transform: rotate(-18deg); }
.hero .k { opacity: .85; font-size: 14px; }
.hero .big { font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin: 2px 0; }
.hero .big small { font-size: 16px; font-weight: 600; opacity: .85; letter-spacing: 0; }
.hero .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.hero .row3 div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; }
.hero .row3 span { display: block; font-size: 11.5px; opacity: .8; } .hero .row3 b { font-size: 17px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.crit { background: var(--crit-bg); color: var(--crit); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.muted { background: var(--card2); color: var(--text2); }
.hero .pill { background: rgba(255,255,255,.2); color: #fff; }
.hero .pill.crit { background: #ff6b6b; color: #fff; } .hero .pill.good { background: var(--lime); color: #1c2a00; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .k { font-size: 12.5px; color: var(--text2); } .kpi .v { font-size: 24px; font-weight: 800; letter-spacing: -.3px; } .kpi .s { font-size: 12px; color: var(--muted); }

/* lists */
.li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; color: #fff; }
.li .t { flex: 1; min-width: 0; } .li .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .li .t span { font-size: 12.5px; color: var(--text2); }
.li .a { text-align: right; white-space: nowrap; } .li .a small { display: block; font-size: 11.5px; color: var(--muted); }
.li.dim { opacity: .55; }
.chev { color: var(--muted); font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 18px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); font-weight: 600; }
.chip.sm { padding: 2px 9px; font-size: 12.5px; border-width: 1px; background: var(--card2); border-color: transparent; }
.chip.me { background: var(--pri-soft); color: var(--pri); font-weight: 700; }
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 10px; font-size: 14px; color: var(--text2); }
.seg button.on { background: var(--card); color: var(--text); font-weight: 700; box-shadow: var(--shadow); }
.mbar { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; }
.mbar button { border: 1px solid var(--line); background: var(--card); width: 38px; height: 38px; border-radius: 19px; font-size: 18px; }
.mbar b { flex: 1; text-align: center; font-size: 16px; }

/* sessions */
.ses { display: flex; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.ses:last-child { border-bottom: 0; }
.ses .d { width: 50px; flex: none; text-align: center; border-radius: 12px; background: var(--card2); padding: 6px 0; }
.ses .d b { display: block; font-size: 20px; line-height: 1.1; } .ses .d span { font-size: 11px; color: var(--text2); text-transform: uppercase; }
.ses .t { flex: 1; min-width: 0; } .ses .t .top { display: flex; gap: 6px; align-items: center; font-weight: 600; flex-wrap: wrap; }
.ses .t .top .a { margin-left: auto; font-weight: 700; }
.ses .chips { margin-top: 6px; gap: 4px; }
.reg { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.reg table { border-collapse: collapse; font-size: 12.5px; }
.reg th, .reg td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.reg th:first-child, .reg td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; font-weight: 600; }
.reg .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bar2); }
.reg .over { color: var(--crit); font-weight: 700; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text2); font-size: 11px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.15); white-space: nowrap; display: none; z-index: 3; }
.rank { display: grid; grid-template-columns: 22px 1fr 44px; gap: 4px 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.rank .n { color: var(--muted); font-weight: 700; text-align: center; } .rank .tr { grid-column: 2; height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; } .rank .tr i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
.rank .v { text-align: right; font-weight: 700; grid-row: span 2; }
.strip { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.strip i { width: 16px; height: 16px; border-radius: 5px; background: var(--card2); }
.strip i.on { background: var(--bar2); }

/* me */
.who { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.who button { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 6px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.meh { display: flex; align-items: center; gap: 12px; }
.meh .av { width: 52px; height: 52px; font-size: 20px; }
.paybtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 800; background: var(--lime); color: #1c2a00; }
.hero .paybtn.ghost { background: rgba(255,255,255,.16); color: #fff; }

/* nav */
nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav#tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--muted); padding: 2px 0; }
nav#tabs button .i { font-size: 21px; height: 28px; display: grid; place-items: center; filter: grayscale(1); opacity: .7; transition: transform .15s; }
nav#tabs button.on { color: var(--pri); font-weight: 700; }
nav#tabs button.on .i { filter: none; opacity: 1; transform: scale(1.1); }
#fab { display: none; position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom)); z-index: 26; border: 0; background: var(--pri); color: var(--on-pri); height: 54px; padding: 0 20px; border-radius: 27px; font-size: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(47,91,216,.4); }
body.admin #fab { display: block; }
.admin-only { display: none !important; }
body.admin .admin-only { display: revert !important; }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: up .24s cubic-bezier(.2,.9,.3,1); padding-bottom: calc(100px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
@keyframes up { from { transform: translateY(36px); opacity: 0; } }
.sheet .sh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.sheet .sh b { flex: 1; font-size: 17px; }
.sheet .sh .x { border: 0; background: var(--card2); width: 36px; height: 36px; border-radius: 18px; font-size: 16px; }
.sheet .body { padding: 14px; max-width: 720px; margin: 0 auto; }
label.f { display: block; font-size: 13px; color: var(--text2); margin: 14px 2px 6px; font-weight: 600; }
.in { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 13px; font-size: 16px; outline: none; }
.in:focus { border-color: var(--pri); }
.step { display: flex; align-items: center; gap: 10px; }
.step button { width: 52px; height: 52px; border-radius: 26px; border: 0; background: var(--card2); font-size: 26px; font-weight: 700; }
.step .in { text-align: center; font-size: 28px; font-weight: 800; flex: 1; }
.btn { border: 0; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 700; width: 100%; background: var(--card2); }
.btn.pri { background: var(--pri); color: var(--on-pri); }
.btn.del { background: none; color: var(--crit); }
.btn.sm { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.savebar .btn { max-width: 692px; margin: 0 auto; display: block; }
.preview { margin-top: 10px; padding: 11px 13px; border-radius: 12px; background: var(--pri-soft); color: var(--pri); font-weight: 600; font-size: 14px; }
.preview.crit { background: var(--crit-bg); color: var(--crit); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; }
table.t .r { text-align: right; } table.t tr.total td { font-weight: 700; border-bottom: 0; }
textarea.in { min-height: 300px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .btn { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; z-index: 90; font-size: 14px; max-width: 90vw; text-align: center; animation: up .2s; }
.enter > * { animation: fade .28s ease both; } .enter > *:nth-child(2) { animation-delay: .03s; } .enter > *:nth-child(3) { animation-delay: .06s; } .enter > *:nth-child(n+4) { animation-delay: .09s; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .enter > *, .sheet, .toast { animation: none; } }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="logo">🏸</div>
  <h1 id="club">Badminton Court<small id="upd"></small></h1>
  <span id="adm">ADMIN</span>
  <span id="sync"></span>
  <button class="ib" id="refresh" aria-label="Refresh">↻</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<button id="fab">＋ Today's play</button>
<nav id="tabs">
  <button data-tab="home"><span class="i">🏠</span>Home</button>
  <button data-tab="days"><span class="i">📅</span>Days</button>
  <button data-tab="me"><span class="i">🙋</span>Me</button>
  <button data-tab="stats"><span class="i">📊</span>Stats</button>
  <button data-tab="more"><span class="i">☰</span>More</button>
</nav>
<script src="config.js"></script>
<script>
/* ================== basics ================== */
var D = null, TAB = 'home', M = ym(new Date());
function $(id) { return document.getElementById(id); }
function ls(k, v) { try { if (arguments.length === 1) return localStorage.getItem(k); v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { return v === '' || v == null ? 0 : Number(v) || 0; }
function sum(a, f) { return a.reduce(function (t, x) { return t + (f ? f(x) : x); }, 0); }
function ym(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function iso(d) { return ym(d) + '-' + ('0' + d.getDate()).slice(-2); }
function today() { return iso(new Date()); }
function addM(m, n) { var p = m.split('-'); return ym(new Date(+p[0], +p[1] - 1 + n, 1)); }
function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
var MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function mLabel(m, s) { var p = m.split('-'), n = MN[+p[1] - 1]; return s ? n.slice(0, 3) + ' ' + p[0].slice(2) : n + ' ' + p[0]; }
function dLabel(d) { var x = new Date(d + 'T00:00:00'); return x.getDate() + ' ' + MN[x.getMonth()].slice(0, 3) + ' · ' + DN[x.getDay()]; }
function shortD(s) { var d = new Date(s + 'T00:00:00'); return d.getDate() + ' ' + MN[d.getMonth()].slice(0, 3); }
function inr(n, dec) { if (n === '' || n == null || isNaN(n)) return '—'; var v = Math.abs(n); return (n < -0.004 ? '−' : '') + '₹' + (dec ? v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(v).toLocaleString('en-IN')); }
function rs(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function toast(m) { document.querySelectorAll('.toast').forEach(function (t) { t.remove(); }); var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2800); }
var AVC = ['#2a78d6', '#eb6834', '#1baf7a', '#c98500', '#d55181', '#008300', '#4a3aa7'];
function avatar(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) | 0; return '<span class="av" style="background:' + AVC[Math.abs(h) % AVC.length] + '">' + esc(n.trim().slice(0, 1).toUpperCase()) + '</span>'; }
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ================== backend ================== */
var VALID = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/;
var API = VALID.test(window.BT_API || '') ? window.BT_API : ls('bt_api');
(function () { var h = location.hash, m = h.match(/api=([^&]+)/); if (m) { var u = decodeURIComponent(m[1]); if (VALID.test(u)) { API = u; ls('bt_api', u); } }
  var me = h.match(/me=([^&]+)/); if (me) { ls('bt_me', decodeURIComponent(me[1])); TAB = 'me'; }
  if (h) history.replaceState(null, '', location.pathname); })();
var TOK = ls('bt_tok'), OB = JSON.parse(ls('bt_ob') || '[]'), flushing = false, ME = ls('bt_me');
function post(body) { return fetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).then(function (r) { return r.json(); }); }
var KEYS = { Members: 'Name', Sessions: 'ID', Stock: 'ID', Payments: 'ID', Settings: 'Key' };
function applyLocal(o) {
  var arr = D[o.table], k = KEYS[o.table], find = o.obj._orig !== undefined ? o.obj._orig : o.obj[k];
  var i = arr.findIndex(function (r) { return String(r[k]) === String(find); });
  if (o.op === 'remove') { if (i >= 0) arr.splice(i, 1); return; }
  var clean = Object.assign({}, o.obj); delete clean._orig;
  if (o.table === 'Members' && o.obj._orig && o.obj._orig !== o.obj.Name) localRename(o.obj._orig, o.obj.Name);
  if (clean.Active !== undefined) clean.Active = !(clean.Active === false || String(clean.Active).toUpperCase() === 'FALSE');
  if (i >= 0) arr[i] = Object.assign({}, arr[i], clean); else arr.push(clean);
}
function localRename(from, to) {

  s.querySelector('#iS').onclick = function () { window.open('https://wa.me/?text=' + encodeURIComponent(s.querySelector('#iT').value), '_blank'); };
  s.querySelector('#iC').onclick = function () { copy(s.querySelector('#iT').value); };

/* ================== events ================== */
document.addEventListener('click', function (e) {
  var inSheet = e.target.closest('.sheet');
  var t = e.target.closest('[data-tab],[data-m],[data-member],[data-ses],[data-iam],[data-pay],[data-recpay],[data-editpay],[data-act],[data-dv],[data-rank],#fab,#refresh'); if (!t) return;
  if (inSheet && !t.matches('[data-iam],[data-pay],[data-recpay],[data-editpay]')) return;
  var d = t.dataset;
  if (d.tab) { TAB = d.tab; render(); }
  else if (d.m) { M = addM(M, +d.m); render(); }
  else if (d.member) memberSheet(d.member);
  else if (d.ses) sessionView(d.ses);
  else if (d.iam !== undefined) { ME = d.iam || null; ls('bt_me', ME); if (inSheet) closeSheet(); TAB = 'me'; render(); if (ME) toast('Hi ' + ME + ' 👋'); }
  else if (d.pay !== undefined) upiSheet(d.pay, num(d.amt));
  else if (d.recpay) (inSheet ? swapTo : function (f) { f(); })(function () { payForm(null, d.recpay); });
  else if (d.editpay) (inSheet ? swapTo : function (f) { f(); })(function () { payForm(D.Payments.find(function (p) { return p.ID === d.editpay; })); });
  else if (d.dv) { DAYVIEW = d.dv; render(); }
  else if (d.rank) { RANK = d.rank; render(); }
  else if (d.act) ({ shuttles: shuttlesSheet, week: weekSheet, dues: duesSheet, invite: inviteSheet, login: loginSheet, newses: function () { sessionForm(); }, newpay: function () { payForm(); }, newbuy: function () { stockForm(null, 'Purchase'); }, newadj: function () { stockForm(null, 'Adjustment'); }, members: membersSheet, settings: settingsSheet,
    logout: function () { if (confirm('Log out of admin on this phone?')) { post({ action: 'logout', token: TOK }).catch(function () {}); logoutLocal(); load(); toast('Logged out'); } } })[d.act]();
  else if (t.id === 'fab') sessionForm();
  else if (t.id === 'refresh') { t.style.transform = 'rotate(360deg)'; t.style.transition = 'transform .6s'; setTimeout(function () { t.style.transform = ''; t.style.transition = ''; }, 650); load('Up to date ✓'); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - lastLoad > 60000) load(); });
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (after[TAB]) after[TAB](); }, 200); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
syncPill();
load();
</script>
